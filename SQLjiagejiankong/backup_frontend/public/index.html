<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>价格监控系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>价格监控系统</h1>
      <div id="product-info" class="product-info">
        <div class="loading">加载中...</div>
      </div>
      <div id="stats" class="stats">
        <div class="stat-item">
          <span class="stat-label">商品数</span>
          <span class="stat-value" id="product-count">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">SKU 数</span>
          <span class="stat-value" id="sku-count">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">最后更新</span>
          <span class="stat-value" id="last-update">-</span>
        </div>
      </div>
    </header>

    <div class="main">
      <div class="sidebar">
        <div class="date-selector">
          <label for="date-select">查询日期:</label>
          <select id="date-select">
            <option value="">加载中...</option>
          </select>
        </div>
        <div class="time-selector" style="display: none;">
          <label for="time-select">查询时间:</label>
          <select id="time-select">
            <option value="">选择时间</option>
          </select>
        </div>
        <div id="sku-list" class="sku-list">
          <div class="loading">加载中...</div>
        </div>
      </div>

      <div class="content">
        <div id="chart-info" class="chart-info" style="display: none;">
          <div class="info-text">
            <span id="comparison-text"></span>
          </div>
        </div>
        <div id="chart-container" class="chart-container">
          <div class="empty-state">
            <p>选择查询日期查看活动价变化</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
